name: Android test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        working-directory: frontend
        run: npx -y yarn@1.22.22 install --frozen-lockfile
      - name: Build and sync mobile app
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://sistemaflow-production.up.railway.app
          CI: 'false'
        run: npm run mobile:sync
      - name: Build Android debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ifixflow-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
